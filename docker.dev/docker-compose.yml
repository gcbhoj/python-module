services:
  app:
    build:
      context: ..
      dockerfile: docker.dev/Dockerfile

    env_file:
      - ../.env

    container_name: python-services

    ports:
      - "5100:5100"

    volumes:
      - ../:/app

    restart: unless-stopped

    networks:
      - my-app

  notebook:
    build:
      context: ..
      dockerfile: docker.dev/Dockerfile

    container_name: ml_notebook

    env_file:
      - ../.env

    ports:
      - "8888:8888"

    volumes:
      - ../:/app

    working_dir: /app/jupyter_notebook

    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=my-token

    restart: unless-stopped

    networks:
      - my-app

networks:
  my-app:
